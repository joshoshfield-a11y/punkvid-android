name: Build VIDEOBYTE APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build Release APK
        run: gradle --no-daemon assembleRelease

      - name: List APK outputs
        run: |
          echo "=== Debug outputs ==="
          ls -la app/build/outputs/apk/debug/ || echo "No debug dir"
          echo "=== Release outputs ==="
          ls -la app/build/outputs/apk/release/ || echo "No release dir"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: videobyte-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: videobyte-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
